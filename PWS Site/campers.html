<title>Build Your Freedom Camper | Proven Whitetail Systems</title>

<style>
:root{--earth:#18160F;--timber:#2C2416;--pine:#293820;--lichen:#4A5C34;--rust:#B5521A;--blaze:#D4782A;--blaze-lt:#EDA050;--parchment:#EDE5CC;--stone:#C4BB9E;--bark-lt:#352C1A;--white:#F6F1E6}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Source Sans 3',sans-serif;background:var(--earth);color:var(--parchment);overflow-x:hidden}
/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 52px;height:88px;background:rgba(24,22,15,0.97);backdrop-filter:blur(16px);border-bottom:2px solid var(--rust)}
.nav-logo{display:flex;align-items:center;gap:16px;text-decoration:none}
.nav-logo img{height:52px;width:auto;filter:invert(1) sepia(1) saturate(3) hue-rotate(10deg) brightness(1.1);flex-shrink:0}
.nav-logo-text{display:flex;flex-direction:column;gap:4px}
.nav-logo-top{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:4px;color:var(--blaze);text-transform:uppercase;line-height:1;white-space:nowrap}
.nav-logo-sub{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--stone);font-weight:400;white-space:nowrap}
.nav-links{display:flex;gap:28px;list-style:none;align-items:center}
.nav-links a{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--stone);text-decoration:none;font-weight:600;transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--blaze)}
.nav-cta{background:var(--rust)!important;color:var(--white)!important;padding:10px 22px!important;font-weight:700!important;letter-spacing:2px!important;transition:background .2s!important}
.nav-cta:hover{background:var(--blaze)!important}
/* SHARED UTILS */
.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--blaze);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.eyebrow::before{content:'';display:block;width:34px;height:2px;background:var(--rust);flex-shrink:0}
.section-title{font-family:'Oswald',sans-serif;font-size:clamp(36px,5vw,60px);font-weight:700;letter-spacing:2px;line-height:.95;text-transform:uppercase}
.btn-blaze{background:var(--rust);color:var(--white);font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:15px 36px;border:none;cursor:pointer;text-decoration:none;display:inline-block;border-bottom:3px solid #6e2800;transition:background .2s,transform .15s}
.btn-blaze:hover{background:var(--blaze);transform:translateY(-2px)}
.btn-blaze:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-ghost{color:var(--parchment);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600;text-decoration:none;border-bottom:1px solid rgba(237,229,204,0.32);padding-bottom:3px;transition:color .2s,border-color .2s}
.btn-ghost:hover{color:var(--blaze);border-color:var(--blaze)}
/* PAGE HERO */
.page-hero{padding:150px 80px 56px;background:var(--timber);position:relative;overflow:hidden;border-bottom:2px solid var(--rust)}
.page-hero::before{content:'';position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=1600&q=80') center/cover no-repeat;filter:brightness(0.12) saturate(0.4)}
.page-hero-content{position:relative;z-index:2;max-width:760px}
.page-hero-back{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--stone);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:8px;margin-bottom:24px;transition:color .2s}
.page-hero-back:hover{color:var(--blaze)}
.page-hero p{font-size:15px;line-height:1.8;color:var(--stone);font-weight:300;max-width:600px;margin-top:20px}

/* MODEL SELECTOR STRIP */
.model-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--rust);border-bottom:2px solid var(--rust);position:sticky;top:88px;z-index:150}
.model-btn{background:var(--timber);color:var(--stone);border:none;padding:22px 14px;cursor:pointer;text-align:left;transition:background .2s,color .2s;font-family:'Source Sans 3',sans-serif}
.model-btn:hover{background:var(--bark-lt)}
.model-btn.active{background:var(--earth);color:var(--white)}
.model-btn.active .model-btn-name{color:var(--blaze)}
.model-btn-tag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--blaze);font-weight:700;margin-bottom:6px;display:block}
.model-btn-name{font-family:'Oswald',sans-serif;font-size:19px;font-weight:700;letter-spacing:1px;display:block;margin-bottom:4px;color:var(--parchment);transition:color .2s}
.model-btn-price{font-size:13px;color:var(--stone);font-weight:400}

/* PRODUCT DETAIL LAYOUT */
.prod-layout{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:calc(100vh - 88px)}
.prod-gallery{position:sticky;top:calc(88px + 76px);height:calc(100vh - 88px - 76px);overflow:hidden;background:var(--timber)}
.prod-gallery-img-div{width:100%;height:100%;background-size:cover;background-position:center;filter:brightness(0.75) saturate(0.7);transition:background-image .3s ease}
.prod-info{padding:56px 60px 100px;background:var(--earth)}
.prod-tag{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--blaze);font-weight:700;margin-bottom:12px}
.prod-name{font-family:'Oswald',sans-serif;font-size:clamp(32px,4vw,52px);font-weight:700;letter-spacing:2px;line-height:.95;color:var(--white);margin-bottom:20px}
.prod-price{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;color:var(--blaze);margin-bottom:24px}
.prod-desc{font-size:15px;line-height:1.85;color:var(--stone);font-weight:300;margin-bottom:32px}
.prod-specs{margin-bottom:36px}
.prod-specs-title,.prod-features-title,.opt-title{font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:2px;color:var(--blaze);margin-bottom:16px;text-transform:uppercase}
.spec-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(181,82,26,0.15)}
.spec-row:first-of-type{border-top:1px solid rgba(181,82,26,0.15)}
.spec-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--stone);font-weight:600}
.spec-val{font-size:14px;color:var(--parchment);font-weight:400;text-align:right}
.prod-features{margin-bottom:36px}
.feature-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:14px;line-height:1.6;color:var(--stone);font-weight:300}
.feature-item::before{content:'✓';color:var(--blaze);font-weight:700;flex-shrink:0;margin-top:1px}
  /* LAYERED IMAGE CONTAINER CSS */
.prod-gallery{position:sticky;top:76px;height:calc(100vh - 76px);overflow:hidden;background:var(--timber)}
.prod-gallery-container{
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #211c14;
}

/* THE BACKGROUND LAYER CSS */
.bg-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  opacity: 0.8; 
}

.camper-layer{
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain; 
  transition: opacity 0.3s ease;
  z-index: 1; /* Keeps camper and accessories in front of the woods */
}

/* OPTIONS / BUILDOUT */
.options-box{background:var(--timber);border:1px solid rgba(181,82,26,0.2);border-top:3px solid var(--rust);padding:28px 28px 8px;margin-bottom:28px}
.opt-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid rgba(181,82,26,0.15)}
.opt-row:last-child{border-bottom:none}
.opt-row input{margin-top:3px;width:17px;height:17px;accent-color:var(--rust);flex-shrink:0;cursor:pointer}
.opt-row.disabled{opacity:.38}
.opt-row.disabled label{cursor:not-allowed}
.opt-label{flex:1;cursor:pointer}
.opt-name{font-size:14px;color:var(--parchment);font-weight:600;display:block;margin-bottom:2px}
.opt-note{font-size:11.5px;color:var(--stone);font-weight:300}
.opt-price{font-size:14px;color:var(--blaze);font-weight:600;white-space:nowrap;padding-top:1px}
.opt-sub{padding-left:29px}

.summary-box{background:var(--bark-lt);border:1px solid rgba(181,82,26,0.3);padding:24px 28px;margin-bottom:32px}
.summary-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--stone);padding:6px 0}
.summary-row.total{border-top:1px solid rgba(181,82,26,0.35);margin-top:8px;padding-top:14px;font-size:18px;color:var(--white);font-weight:700}
.summary-row.total span:last-child{color:var(--blaze);font-family:'Oswald',sans-serif}

/* MINI INQUIRY FORM */
.mini-form{background:var(--timber);border:1px solid rgba(181,82,26,0.2);border-top:3px solid var(--rust);padding:32px;margin-bottom:40px}
.mini-form-title{font-family:'Oswald',sans-serif;font-size:20px;letter-spacing:2px;color:var(--parchment);margin-bottom:20px;text-transform:uppercase}
.mf-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.mf-group label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);font-weight:700}
.mf-group input,.mf-group textarea,.mf-group select{background:rgba(255,255,255,0.04);border:1.5px solid rgba(181,82,26,0.2);padding:11px 14px;font-family:'Source Sans 3',sans-serif;font-size:13px;color:var(--parchment);outline:none;transition:border-color .2s;-webkit-appearance:none;width:100%}
.mf-group input:focus,.mf-group textarea:focus,.mf-group select:focus{border-color:var(--rust)}
.mf-group input::placeholder,.mf-group textarea::placeholder{color:rgba(196,187,158,0.4)}
.mf-group textarea{resize:vertical;min-height:80px}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf-submit{background:var(--rust);color:var(--white);border:none;padding:13px 28px;font-family:'Source Sans 3',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;border-bottom:3px solid #6e2800;transition:background .2s;width:100%;margin-top:4px}
.mf-submit:hover{background:var(--blaze)}
.mf-build-readout{background:rgba(255,255,255,0.03);border:1px solid rgba(181,82,26,0.15);padding:14px 16px;font-size:12.5px;line-height:1.7;color:var(--stone);margin-bottom:16px;white-space:pre-wrap;font-family:'Source Sans 3',monospace}

/* FOOTER */
footer{background:#0A0907;padding:48px 80px 28px;border-top:2px solid var(--rust)}
.ftop{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:60px;margin-bottom:40px}
.flogo{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.flogo img{height:44px;width:auto;filter:invert(1) sepia(1) saturate(2.5) hue-rotate(15deg) brightness(.95);opacity:.8}
.flogo-name{font-family:'Oswald',sans-serif;font-size:17px;letter-spacing:3px;font-weight:700;color:var(--blaze);text-transform:uppercase;line-height:1}
.fbrand-desc{font-size:13px;line-height:1.8;color:rgba(196,187,158,0.42);font-weight:300}
.fcol-title{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--blaze);font-weight:700;margin-bottom:14px}
.flinks{list-style:none;display:flex;flex-direction:column;gap:8px}
.flinks a{font-size:13px;color:rgba(196,187,158,0.48);text-decoration:none;transition:color .2s}
.flinks a:hover{color:var(--blaze)}
.fbot{border-top:1px solid rgba(255,255,255,0.048);padding-top:20px;display:flex;justify-content:space-between;align-items:center}
.fcopy{font-size:11px;color:rgba(196,187,158,0.26);letter-spacing:1px}

/* MOBILE */
@media(max-width:900px){
  nav{padding:0 18px}.nav-links{display:none}
  .page-hero{padding:120px 24px 40px}
  .model-strip{grid-template-columns:repeat(2,1fr);top:88px;position:relative}
  .prod-layout{grid-template-columns:1fr}
  .prod-gallery{position:relative;height:260px;top:auto}
  .prod-info{padding:36px 20px 60px}
  footer{padding:48px 24px 28px}.ftop{grid-template-columns:1fr;gap:28px}
}

<script>
const MODELS = [
  {
    id: '48x79',
    tag: 'Mid-Size Truck Camper',

    price: 3499.99,

    }
  },
  {

    tag: 'Full-Size Truck Camper',
    name: 'FREEDOM CAMPER<br>58×79',
    price: 3699.99,
    desc: "The 58×79 is the compact option for full-size truck owners who need the extra interior width but want to keep the camper from overhanging the tailgate.",
    rackSize: '58',
    assets: {
      baseGrey: '58_79 Grey Base.png',
      baseTan: '58_79 Tan Base.png',
      ac: '58_79 A_C.png',
      awning: '58_79 Awning.png', 
      fan: '58_79 Vent Fan.png',
      rack: '58_79 Roof Rack.png'
    }
  },
  {
    id: '58x89',
    tag: 'Best Seller — Full-Size',
    name: 'FREEDOM CAMPER<br>58×89',
    price: 3799.99,
    desc: "The most popular Freedom Camper by a wide margin. The extra 10\" of length gives taller campers room to stretch out and provides more storage for gear.",
    rackSize: '58',
    assets: {
      baseGrey: '58_89 Grey Base.png',
      baseTan: '58_89 Tan Base.png',
      ac: '58_89 A_C.png',
      awning: '58_89 Awning.png',
      fan: '58_89 Vent Fan.png', 
      rack: '58_89 Roof Rack.png' 
    }
  },
  {
    id: '72x89',
    tag: 'Maximum Capacity',
    name: 'FREEDOM CAMPER<br>72×89',
    price: 3999.99,
    desc: "The 72×89 provides maximum interior volume for heavy-duty trucks and flatbeds, giving you the most width and length available for extended off-grid trips.",
    rackSize: '72',
    assets: {
      baseGrey: '72 _ 89 Grey Base.png',
      baseTan: '72 _ 89 Tan Base.png',
      ac: '72 _ 89 A_C.png',
      awning: '72 _ 89 Awning.png',
      fan: '72 _ 89 Vent Fan.png',
      rack: '72 _ 89 Roof Rack.png'
    }
  }
];

const OPTIONS = [
  { id: 'truckMount', name: 'Truck Mount Kit', note: 'Hardware for mounting to truck bed rails', price: 99.99 },
  { id: 'trailerMount', name: 'Trailer Mount Kit', note: 'Hardware for flatbed or trailer mounting', price: 39.99 },
  { id: 'ventFan', name: '12V Vent Fan', note: 'Powered ventilation for airflow on warm days', price: 159.99 },
  { id: 'ac', name: '12V A/C Unit', note: 'Runs off 12V power — keeps the camper cool in hot weather', price: 974.99 },
  { id: 'roofRack', name: 'Roof Rack', note: model => `Sized for the ${model.rackSize}" camper`, price: 525 },
  { id: 'awning', name: 'Awning Options', note: 'Choose a series below', price: 0, isAwningGroup: true },
  
  // DYNAMIC PRICING FOR SIDEWALLS
  { 
    id: 'awningWalls', 
    name: 'Awning Sidewalls', 
    note: 'Add enclosed walls to your selected awning',
    requiresAwning: true, 
    price: () => {
      if (selections.awningChoice === '270xl') return 699.99;
      return 399.99; // Standard 270 and 180 use the $399.99 pricing
    }
  }
];

const AWNING_CHOICES = [
  { id: 'none', label: 'No awning', price: 0 },
  { id: '180', label: 'OpenRoad 180° Awning', price: 499.99 },
  { id: '270', label: 'OpenRoad 270° Awning Standard', price: 699.99 },
  { id: '270xl', label: 'OpenRoad 270° XL Awning', price: 999.99 }
];

const TAX_RATE = 0.055; 
const FREIGHT_COST = 250.00; 
  
let currentModelId = '58x79';

// Added new selections to tracking state
let selections = { 
  color: 'grey', 
  truckMount: false,
  trailerMount: false,
  ventFan: false, 
  ac: false, 
  roofRack: false, 
  awningChoice: 'none',
  awningWalls: false 
};

function fmt(n){ return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function getModel(id){ return MODELS.find(m => m.id === id); }
function resolvePrice(opt, model){ return typeof opt.price === 'function' ? opt.price(model) : opt.price; }
function resolveNote(opt, model){ return typeof opt.note === 'function' ? opt.note(model) : opt.note; }

function renderModelStrip(){
  const strip = document.getElementById('modelStrip');
  strip.innerHTML = MODELS.map(m => `
    <button class="model-btn ${m.id===currentModelId?'active':''}" data-id="${m.id}">
      <span class="model-btn-tag">${m.tag}</span>
      <span class="model-btn-name">${m.id.replace('x','×')}</span>
      <span class="model-btn-price">${fmt(m.price)}</span>
    </button>
  `).join('');
  
  strip.querySelectorAll('.model-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentModelId = btn.dataset.id;
      
      // LOGIC CHECK: Clean up incompatible selections for 48x79
      if (currentModelId === '48x79') {
        selections.roofRack = false; 
        if (selections.ac && selections.ventFan) {
          selections.ventFan = false;
        }
      }
      
      renderAll();
    });
  });
}

function renderProduct(){
  const m = getModel(currentModelId);
  
  document.getElementById('layer-base').src = selections.color === 'tan' ? m.assets.baseTan : m.assets.baseGrey;
  document.getElementById('layer-ac').src = m.assets.ac;
  document.getElementById('layer-awning').src = m.assets.awning;
  document.getElementById('layer-fan').src = m.assets.fan;
  document.getElementById('layer-rack').src = m.assets.rack;

  document.getElementById('prodTag').textContent = m.tag;
  document.getElementById('prodName').innerHTML = m.name;
  document.getElementById('prodBasePrice').textContent = fmt(m.price) + ' base';
  document.getElementById('prodDesc').textContent = m.desc;
}

function renderOptions(){
  const m = getModel(currentModelId);
  const box = document.getElementById('optionRows');
  
  let html = `
    <div class="opt-row" style="flex-direction:column;align-items:stretch;gap:8px">
      <div style="display:flex;justify-content:space-between"><span class="opt-name">Exterior Color</span><span class="opt-note">Select your shell color</span></div>
      <div style="display:flex;gap:16px;padding-left:2px">
        <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--parchment);cursor:pointer">
          <input type="radio" name="camperColor" value="grey" ${selections.color==='grey'?'checked':''} style="accent-color:var(--rust);width:16px;height:16px">
          Grey
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--parchment);cursor:pointer">
          <input type="radio" name="camperColor" value="tan" ${selections.color==='tan'?'checked':''} style="accent-color:var(--rust);width:16px;height:16px">
          Tan
        </label>
      </div>
    </div>
  `;

  OPTIONS.forEach(opt => {
    // Hide Roof Rack if 48x79 is selected
    if (opt.id === 'roofRack' && currentModelId === '48x79') return;
    
    // Hide Awning Walls if no awning is selected
    if (opt.requiresAwning && selections.awningChoice === 'none') return;

    if (opt.isAwningGroup){
      html += `<div class="opt-row" style="flex-direction:column;align-items:stretch;gap:8px">
        <div style="display:flex;justify-content:space-between"><span class="opt-name">${opt.name}</span><span class="opt-note">${opt.note}</span></div>
        <div style="display:flex;flex-direction:column;gap:6px;padding-left:2px">
          ${AWNING_CHOICES.map(c => `
            <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--parchment);cursor:pointer">
              <input type="radio" name="awningChoice" value="${c.id}" ${selections.awningChoice===c.id?'checked':''} style="accent-color:var(--rust);width:16px;height:16px">
              ${c.label} ${c.price ? `<span style="color:var(--blaze);font-weight:600;margin-left:auto">${fmt(c.price)}</span>` : ''}
            </label>`).join('')}
        </div>
      </div>`;
      return;
    }

    const price = resolvePrice(opt, m);
    const note = resolveNote(opt, m);
    html += `<div class="opt-row">
      <input type="checkbox" id="opt-${opt.id}" data-id="${opt.id}" ${selections[opt.id]?'checked':''}>
      <label class="opt-label" for="opt-${opt.id}">
        <span class="opt-name">${opt.name}</span>
        <span class="opt-note">${note}</span>
      </label>
      <span class="opt-price">${fmt(price)}</span>
    </div>`;
  });

  box.innerHTML = html;

  // Listeners for checkboxes
  box.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.dataset.id;
      
      // Mutual Exclusivity for 48x79 AC/Fan
      if (currentModelId === '48x79') {
        if (id === 'ac' && cb.checked) selections.ventFan = false;
        else if (id === 'ventFan' && cb.checked) selections.ac = false;
      }
      
      // Mutual Exclusivity for Mount Kits
      if (id === 'truckMount' && cb.checked) selections.trailerMount = false;
      if (id === 'trailerMount' && cb.checked) selections.truckMount = false;
      
      selections[id] = cb.checked;
      renderAll();
    });
  });

  // Listeners for radio buttons
  box.querySelectorAll('input[name=awningChoice]').forEach(r => {
    r.addEventListener('change', () => {
      selections.awningChoice = r.value;
      
      // Automatically disable walls if they remove the awning entirely
      if (selections.awningChoice === 'none') {
        selections.awningWalls = false;
      }
      
      renderAll();
    });
  });

  box.querySelectorAll('input[name=camperColor]').forEach(r => {
    r.addEventListener('change', () => {
      selections.color = r.value;
      renderAll();
    });
  });
}

function renderSummary(){
  const m = getModel(currentModelId);
  let rows = [];
  let subtotal = m.price; 
  
  rows.push([`Freedom Camper ${m.id.replace('x','×')} (${selections.color === 'tan' ? 'Tan' : 'Grey'})`, m.price]);

  OPTIONS.forEach(opt => {
    if (opt.isAwningGroup || opt.requires) return;
    
    // Don't calculate these if hidden
    if (opt.id === 'roofRack' && currentModelId === '48x79') return; 
    if (opt.requiresAwning && selections.awningChoice === 'none') return;
    
    if (selections[opt.id]){
      const p = resolvePrice(opt, m);
      subtotal += p; 
      rows.push([opt.name, p]);
    }
  });

  if (selections.awningChoice !== 'none'){
    const choice = AWNING_CHOICES.find(c => c.id === selections.awningChoice);
    subtotal += choice.price; 
    rows.push([choice.label, choice.price]);
  }

  const taxAmount = subtotal * TAX_RATE;
  const total = subtotal + taxAmount + FREIGHT_COST;

  rows.push(['Freight', FREIGHT_COST]);
  rows.push([`Sales Tax (${(TAX_RATE * 100).toFixed(1)}%)`, taxAmount]);
  
  document.getElementById('summaryRows').innerHTML = rows.map(([label,price]) =>
    `<div class="summary-row"><span>${label}</span><span>${fmt(price)}</span></div>`
  ).join('');
  document.getElementById('totalPrice').textContent = fmt(total);
}

function renderAll(){
  renderModelStrip();
  renderProduct();
  renderOptions();
  renderSummary();

  document.getElementById('layer-ac').style.display = selections.ac ? 'block' : 'none';
  document.getElementById('layer-fan').style.display = selections.ventFan ? 'block' : 'none';
  document.getElementById('layer-rack').style.display = (selections.roofRack && currentModelId !== '48x79') ? 'block' : 'none'; 
  
  // Display the awning layer whenever ANY awning is selected
  document.getElementById('layer-awning').style.display = (selections.awningChoice !== 'none') ? 'block' : 'none';
}

// Initial load
renderAll();
</script>
</body>
</html>
