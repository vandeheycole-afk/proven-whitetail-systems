<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom Campers | Proven Whitetail Systems</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 40px;
        }
        .catalog {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        .camper-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .camper-card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            background: #eee;
            margin-bottom: 15px;
        }
        .camper-card h2 {
            font-size: 1.4em;
            margin: 0 0 10px 0;
            line-height: 1.2;
        }
        .price {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c7a2c;
            margin-bottom: 10px;
        }
        .tag {
            display: inline-block;
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .desc {
            font-size: 0.95em;
            line-height: 1.5;
            color: #555;
        }
    </style>
</head>
<body>

        // This script runs automatically to build the layout on your webpage
        const catalog = document.getElementById('camper-catalog');
        
        MODELS.forEach(model => {
            const card = document.createElement('div');
            card.className = 'camper-card';
            
            card.innerHTML = `
                <img src="${model.image}" alt="Image of ${model.id}">
                <h2>${model.name}</h2>
                <div class="price">$${model.price.toLocaleString()}</div>
                <div class="tag">${model.tag}</div>
                <div class="desc">${model.desc}</div>
            `;
            
            catalog.appendChild(card);
        });

</body>
